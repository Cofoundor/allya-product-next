# Netlify picks up the Next.js runtime automatically once it sees Next in
# package.json — this only pins the build and the Node version (Next 16
# needs >= 20.9, matching the "engines" field).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_API_URL is NOT set here on purpose — it differs per deploy and
  # is baked into the client bundle at build time. Set it in the Netlify site's
  # environment variables to the API's origin + /api/v1, then redeploy.
  # Without it the build ships pointing at localhost and every request fails;
  # src/lib/api/client.ts detects that case and says so in the console.
